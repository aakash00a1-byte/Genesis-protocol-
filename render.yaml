# Render Blueprint for Genesis Protocol
# Deploy to Render: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: genesis-protocol
    runtime: python
    buildCommand: cd web && pip install -r requirements.txt
    startCommand: cd web && gunicorn app_v3:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /health
    autoDeploy: true
    region: singapore
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        value: genesis-admin-2024
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: PYTHONUNBUFFERED
        value: "true"