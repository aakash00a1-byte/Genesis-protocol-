# Render Blueprint for Genesis Protocol
# Deploy to Render: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: genesis-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python3 -m genesis_protocol.main
    healthCheckPath: /
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: PYTHONUNBUFFERED
        value: "true"