version: '3.8'

services:
  # Genesis Protocol Bot
  genesis:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: genesis-protocol
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "8501:8501"
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - HUGGINGFACE_API_KEY=${HUGGINGFACE_API_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CHROMA_DB_PATH=/data/chroma_db
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - APP_ENV=production
      - APP_DEBUG=false
    volumes:
      - ./data:/data
      - ./.env:/app/.env:ro
    depends_on:
      - redis
    networks:
      - genesis-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: genesis-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - genesis-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Streamlit Dashboard (optional)
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: genesis-dashboard
    restart: unless-stopped
    command: streamlit run streamlit/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    volumes:
      - ./.env:/app/.env:ro
    depends_on:
      - genesis
    networks:
      - genesis-network

volumes:
  redis-data:

networks:
  genesis-network:
    driver: bridge