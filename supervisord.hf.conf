# Hugging Face Spaces - supervisord config
# Runs web server (port 7860) + Telegram bot + auto-updater together
# Discord bot is optional (set DISCORD_TOKEN to enable)

[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
user=user

[program:web]
command=python web/app.py
directory=/app
environment=PORT="7860",APP_ENV="production",FLASK_APP="web/app.py"
autostart=true
autorestart=true
startsecs=10
stderr_logfile=/tmp/web.err.log
stdout_logfile=/tmp/web.out.log

[program:telegram]
command=python start_all_telegram_bots.py
directory=/app
autostart=true
autorestart=true
startsecs=15
stderr_logfile=/tmp/telegram.err.log
stdout_logfile=/tmp/telegram.out.log

[program:auto_updater]
command=python -c "from genesis_protocol.infinity.auto_updater import run_standalone; run_standalone()"
directory=/app
autostart=true
autorestart=true
stderr_logfile=/tmp/updater.err.log
stdout_logfile=/tmp/updater.out.log
