[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:web]
command=gunicorn --bind 0.0.0.0:5000 --workers 2 web.server_simple:app
directory=/app
autostart=true
autorestart=true
stderr_logfile=/var/log/web.err.log
stdout_logfile=/var/log/web.out.log

[program:telegram]
command=python start_telegram.py
directory=/app
autostart=true
autorestart=true
stderr_logfile=/var/log/telegram.err.log
stdout_logfile=/var/log/telegram.out.log