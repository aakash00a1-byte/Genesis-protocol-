[supervisord]
nodaemon=true
logfile=/app/supervisord.log
pidfile=/app/supervisord.pid

[program:web]
command=python web/app.py
directory=/app
autostart=true
autorestart=true
stderr_logfile=/app/web.err.log
stdout_logfile=/app/web.out.log

[program:telegram]
command=python start_all_telegram_bots.py
directory=/app
autostart=true
autorestart=true
stderr_logfile=/app/telegram.err.log
stdout_logfile=/app/telegram.out.log

[program:discord]
command=python start_discord.py
directory=/app
autostart=true
autorestart=true
stderr_logfile=/app/discord.err.log
stdout_logfile=/app/discord.out.log

[program:auto_updater]
command=python -c "from genesis_protocol.infinity.auto_updater import run_standalone; run_standalone()"
directory=/app
autostart=true
autorestart=true
stderr_logfile=/app/updater.err.log
stdout_logfile=/app/updater.out.log