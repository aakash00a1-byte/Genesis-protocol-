[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genesis-v5"
version = "5.0.0"
description = "Genesis V5 — Kernel-orchestrated multi-agent AI system with memory fabric, tool gateway, security core, and production readiness."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["genesis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"