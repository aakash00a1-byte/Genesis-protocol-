[project]
name = "genesis-protocol"
version = "1.0.0-dev"
description = "Autonomous Multimodal AI Agent with Telegram Interface"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Genesis Protocol Team", email = "team@genesis-protocol.dev" }
]
requires-python = ">=3.11"
keywords = ["ai", "telegram-bot", "autonomous-agent", "llm", "groq", "openai", "gemini"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Telegram Bot
    "python-telegram-bot>=20.0",
    
    # AI Providers
    "groq>=0.4.0",
    "openai>=1.3.0",
    "google-generativeai>=0.3.0",
    "huggingface-hub>=0.19.0",
    
    # Vector & Memory
    "chromadb>=0.4.0",
    "redis>=5.0.0",
    "sqlalchemy>=2.0.0",
    
    # Web & API
    "httpx>=0.25.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    
    # Processing
    "pillow>=10.0.0",
    "pydub>=0.25.0",
    "SpeechRecognition>=3.10.0",
    
    # Utilities
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
    "tenacity>=8.2.0",
    "structlog>=23.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pre-commit>=3.5.0",
]
streamlit = [
    "streamlit>=1.28.0",
    "plotly>=5.18.0",
]
all = [
    "streamlit>=1.28.0",
    "plotly>=5.18.0",
    "redis[hiredis]>=5.0.0",
]

[project.scripts]
genesis = "genesis_protocol.main:main"
genesis-streamlit = "genesis_protocol.streamlit.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"