{% extends "auth_base.html" %}

{% block title %}Create account — GLUTEN{% endblock %}

{% block content %}
<h2 class="auth-title">Create account</h2>
<p class="auth-sub">Set up access to the agent.</p>

{% if error %}
<div class="badge danger" style="display:block; padding:10px 14px; margin-bottom:18px;">{{ error }}</div>
{% endif %}

<form method="POST" autocomplete="on">
    <div class="field">
        <label for="username">Username</label>
        <input class="input" type="text" id="username" name="username"
               placeholder="choose a username" required autofocus autocomplete="username">
    </div>
    <div class="field">
        <label for="email">Email</label>
        <input class="input" type="email" id="email" name="email"
               placeholder="you@example.com" required autocomplete="email">
    </div>
    <div class="field">
        <label for="password">Password</label>
        <input class="input" type="password" id="password" name="password"
               placeholder="create a password" required autocomplete="new-password">
    </div>
    <button type="submit" class="btn btn-primary" style="width:100%;">Create account</button>
</form>

<p class="auth-alt">Already registered? <a href="/login">Sign in</a></p>
{% endblock %}
