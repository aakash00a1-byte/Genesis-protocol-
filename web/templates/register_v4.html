{% extends "base_v4.html" %}

{% block title %}Register - Genesis Protocol v4{% endblock %}

{% block header_title %}{% endblock %}

{% block content %}
<div class="auth-container" style="background: transparent;">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo">⚡</div>
            <h1 class="auth-title">Create Account</h1>
            <p class="auth-subtitle">Join the Genesis AI Protocol</p>
        </div>
        
        <form id="registerForm" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" class="form-input" id="username" name="username" 
                       placeholder="Choose a username" required minlength="3">
            </div>
            
            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" class="form-input" id="email" name="email" 
                       placeholder="Enter your email" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" class="form-input" id="password" name="password" 
                       placeholder="Create a strong password" required minlength="8">
            </div>
            
            <div class="form-group">
                <label class="form-label">Confirm Password</label>
                <input type="password" class="form-input" id="confirm_password" name="confirm_password" 
                       placeholder="Confirm your password" required>
            </div>
            
            <div id="errorMessage" class="form-error" style="display: none;"></div>
            <div id="successMessage" style="display: none; color: #00FF88; margin-bottom: 16px;"></div>
            
            <button type="submit" class="btn btn-primary auth-btn" id="submitBtn">
                Create Account
            </button>
        </form>
        
        <div class="auth-footer">
            Already have an account? <a href="/login">Sign In</a>
        </div>
    </div>
</div>

<script>
async function handleRegister(event) {
    event.preventDefault();
    
    const username = document.getElementById('username').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirm_password').value;
    const errorMsg = document.getElementById('errorMessage');
    const successMsg = document.getElementById('successMessage');
    const submitBtn = document.getElementById('submitBtn');
    
    // Validation
    if (password !== confirmPassword) {
        errorMsg.textContent = 'Passwords do not match';
        errorMsg.style.display = 'block';
        return;
    }
    
    if (password.length < 8) {
        errorMsg.textContent = 'Password must be at least 8 characters';
        errorMsg.style.display = 'block';
        return;
    }
    
    submitBtn.disabled = true;
    submitBtn.textContent = 'Creating account...';
    errorMsg.style.display = 'none';
    
    try {
        const response = await fetch('/register', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username, email, password})
        });
        
        const data = await response.json();
        
        if (data.success) {
            successMsg.textContent = data.message || 'Account created! Redirecting to login...';
            successMsg.style.display = 'block';
            errorMsg.style.display = 'none';
            
            setTimeout(() => {
                window.location.href = data.redirect || '/login';
            }, 2000);
        } else {
            errorMsg.textContent = data.error || 'Registration failed';
            errorMsg.style.display = 'block';
            submitBtn.disabled = false;
            submitBtn.textContent = 'Create Account';
        }
    } catch (err) {
        errorMsg.textContent = 'Connection error. Please try again.';
        errorMsg.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Account';
    }
}
</script>
{% endblock %}
