{% extends "base.html" %}

{% block title %}Chat - Genesis AI{% endblock %}

{% block extra_head %}
<style>
.chat-container {
    display: flex;
    flex-direction: column;
    height: calc(100vh - 120px);
    max-width: 900px;
    margin: 0 auto;
    padding: 20px;
}

.chat-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 20px;
    background: var(--card-bg);
    border-radius: 12px;
    margin-bottom: 20px;
}

.chat-model-info {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    color: var(--text-secondary);
}

.model-badge {
    background: var(--accent);
    color: white;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
}

.chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    background: var(--card-bg);
    border-radius: 12px;
    margin-bottom: 20px;
}

.message {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
    animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

.message.user {
    flex-direction: row-reverse;
}

.message-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
}

.message.user .message-avatar {
    background: var(--accent);
    color: white;
}

.message.bot .message-avatar {
    background: var(--bg-secondary);
    color: var(--accent);
}

.message-content {
    max-width: 80%;
    padding: 12px 16px;
    border-radius: 12px;
    line-height: 1.6;
}

.message.user .message-content {
    background: var(--accent);
    color: white;
    border-bottom-right-radius: 4px;
}

.message.bot .message-content {
    background: var(--bg-secondary);
    color: var(--text);
    border-bottom-left-radius: 4px;
}

.message-content pre {
    background: var(--bg-dark);
    padding: 12px;
    border-radius: 8px;
    overflow-x: auto;
    margin: 10px 0;
    font-size: 13px;
}

.message-content code {
    background: var(--bg-dark);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 13px;
}

.message-content pre code {
    background: none;
    padding: 0;
}

.message-meta {
    font-size: 11px;
    color: var(--text-secondary);
    margin-top: 4px;
    opacity: 0.7;
}

.message.user .message-meta {
    text-align: right;
}

.typing-indicator {
    display: flex;
    gap: 4px;
    padding: 12px 16px;
}

.typing-dot {
    width: 8px;
    height: 8px;
    background: var(--text-secondary);
    border-radius: 50%;
    animation: typing 1.4s infinite;
}

.typing-dot:nth-child(2) { animation-delay: 0.2s; }
.typing-dot:nth-child(3) { animation-delay: 0.4s; }

@keyframes typing {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-4px); }
}

.chat-input-container {
    display: flex;
    gap: 12px;
    padding: 16px;
    background: var(--card-bg);
    border-radius: 12px;
}

.chat-input {
    flex: 1;
    padding: 14px 18px;
    border: 2px solid var(--border);
    border-radius: 24px;
    font-size: 15px;
    font-family: inherit;
    background: var(--bg);
    color: var(--text);
    transition: border-color 0.2s;
}

.chat-input:focus {
    outline: none;
    border-color: var(--accent);
}

.chat-input::placeholder {
    color: var(--text-secondary);
}

.send-btn {
    width: 48px;
    height: 48px;
    border: none;
    border-radius: 50%;
    background: var(--accent);
    color: white;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s, background 0.2s;
}

.send-btn:hover {
    transform: scale(1.05);
}

.send-btn:disabled {
    background: var(--text-secondary);
    cursor: not-allowed;
}

.empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    text-align: center;
    color: var(--text-secondary);
}

.empty-state-icon {
    font-size: 64px;
    margin-bottom: 20px;
}

.empty-state h2 {
    font-size: 24px;
    color: var(--text);
    margin-bottom: 10px;
}

.suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 20px;
}

.suggestion-btn {
    padding: 8px 16px;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
}

.suggestion-btn:hover {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
}
</style>
{% endblock %}

{% block content %}
<div class="chat-container">
    <div class="chat-header">
        <div class="chat-model-info">
            <span>🤖</span>
            <span>Genesis AI Agent</span>
            <span class="model-badge">v2.0</span>
        </div>
        <div>
            <span style="font-size: 12px; color: var(--text-secondary);">
                Mode: <span id="current-mode">normal</span>
            </span>
        </div>
    </div>
    
    <div class="chat-messages" id="chatMessages">
        <div class="empty-state" id="emptyState">
            <div class="empty-state-icon">⚡</div>
            <h2>Genesis AI</h2>
            <p>Start a conversation with the autonomous AI agent</p>
            <div class="suggestions">
                <button class="suggestion-btn" onclick="sendMessage('Build a python chatbot')">🤖 Build a chatbot</button>
                <button class="suggestion-btn" onclick="sendMessage('Explain quantum computing')">📚 Explain quantum</button>
                <button class="suggestion-btn" onclick="sendMessage('Write a poem about space')">✍️ Write a poem</button>
                <button class="suggestion-btn" onclick="sendMessage('Search for latest AI news')">🔍 Search news</button>
            </div>
        </div>
    </div>
    
    <div class="chat-input-container">
        <input type="text" class="chat-input" id="messageInput" 
               placeholder="Type your message..." 
               onkeypress="if(event.key==='Enter') sendMessage()">
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
            </svg>
        </button>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const chatMessages = document.getElementById('chatMessages');
const messageInput = document.getElementById('messageInput');
const sendBtn = document.getElementById('sendBtn');
const emptyState = document.getElementById('emptyState');
let isLoading = false;

function addMessage(content, isUser = false, meta = {}) {
    if (emptyState) emptyState.remove();
    
    const msgDiv = document.createElement('div');
    msgDiv.className = `message ${isUser ? 'user' : 'bot'}`;
    
    const avatar = isUser ? '👤' : '⚡';
    const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    
    let metaHtml = '';
    if (!isUser && meta.model) {
        metaHtml = `<div class="message-meta">${meta.model} • ${meta.mode || 'normal'} mode</div>`;
    }
    
    msgDiv.innerHTML = `
        <div class="message-avatar">${avatar}</div>
        <div class="message-content">
            ${formatContent(content)}
            ${metaHtml}
        </div>
    `;
    
    chatMessages.appendChild(msgDiv);
    chatMessages.scrollTop = chatMessages.scrollHeight;
}

function formatContent(content) {
    // Convert markdown code blocks
    content = content.replace(/```(\w*)\n?([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
    // Convert inline code
    content = content.replace(/`([^`]+)`/g, '<code>$1</code>');
    // Convert bold
    content = content.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    // Convert newlines to br
    content = content.replace(/\n/g, '<br>');
    return content;
}

function showTyping() {
    const typingDiv = document.createElement('div');
    typingDiv.className = 'message bot';
    typingDiv.id = 'typingIndicator';
    typingDiv.innerHTML = `
        <div class="message-avatar">⚡</div>
        <div class="message-content">
            <div class="typing-indicator">
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            </div>
        </div>
    `;
    chatMessages.appendChild(typingDiv);
    chatMessages.scrollTop = chatMessages.scrollHeight;
}

function hideTyping() {
    const typing = document.getElementById('typingIndicator');
    if (typing) typing.remove();
}

async function sendMessage(preset = null) {
    const message = preset || messageInput.value.trim();
    if (!message || isLoading) return;
    
    isLoading = true;
    sendBtn.disabled = true;
    messageInput.value = '';
    
    // Add user message
    addMessage(message, true);
    showTyping();
    
    try {
        const response = await fetch('/api/chat', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({message})
        });
        
        const result = await response.json();
        hideTyping();
        
        if (result.success) {
            addMessage(result.response, false, {
                model: result.model,
                mode: result.mode
            });
            document.getElementById('current-mode').textContent = result.mode;
        } else {
            addMessage('Sorry, I encountered an error. Please try again.', false);
        }
    } catch (err) {
        hideTyping();
        addMessage('Connection error. Please check your internet.', false);
    } finally {
        isLoading = false;
        sendBtn.disabled = false;
        messageInput.focus();
    }
}

// Load chat history on page load
async function loadHistory() {
    try {
        const response = await fetch('/api/history?limit=50');
        const result = await response.json();
        
        if (result.history && result.history.length > 0) {
            result.history.reverse().forEach(item => {
                addMessage(item.message, true);
                addMessage(item.response, false, {
                    model: item.model_used
                });
            });
        }
    } catch (err) {
        console.log('Could not load history');
    }
}

// Initialize
loadHistory();
messageInput.focus();
</script>
{% endblock %}
