<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - Genesis Protocol</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --neon-green: #00ff88;
            --neon-cyan: #00d4ff;
            --neon-purple: #a855f7;
            --dark-bg: #0a0a0f;
            --panel-bg: #111122;
            --border-color: #1a1a2e;
        }
        
        body {
            font-family: 'JetBrains Mono', monospace;
            background: var(--dark-bg);
            color: #fff;
            height: 100vh;
            overflow: hidden;
        }
        
        .scan-line {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--neon-green);
            animation: scan 4s linear infinite;
            opacity: 0.15;
            pointer-events: none;
            z-index: 9999;
        }
        
        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }
        
        .app-container {
            display: flex;
            height: 100vh;
        }
        
        .sidebar {
            width: 60px;
            background: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 15px 0;
        }
        
        .sidebar-logo {
            text-align: center;
            padding: 10px;
            margin-bottom: 20px;
            font-size: 24px;
            color: var(--neon-green);
            text-shadow: 0 0 15px var(--neon-green);
        }
        
        .sidebar-nav {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding: 0 10px;
        }
        
        .nav-item {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            color: #666;
            text-decoration: none;
            transition: all 0.3s;
            font-size: 18px;
        }
        
        .nav-item:hover, .nav-item.active {
            background: rgba(0, 255, 136, 0.1);
            color: var(--neon-green);
        }
        
        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        .chat-header {
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .chat-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .chat-avatar {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--neon-green), var(--neon-cyan));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #000;
        }
        
        .chat-details h2 {
            font-size: 14px;
            color: #fff;
        }
        
        .chat-details span {
            font-size: 11px;
            color: var(--neon-green);
        }
        
        .header-actions {
            display: flex;
            gap: 10px;
        }
        
        .header-btn {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: transparent;
            color: #666;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            font-size: 14px;
        }
        
        .header-btn:hover {
            border-color: var(--neon-green);
            color: var(--neon-green);
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .message {
            display: flex;
            gap: 12px;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message.user {
            flex-direction: row-reverse;
        }
        
        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 12px;
            flex-shrink: 0;
        }
        
        .message.genesis .message-avatar {
            background: linear-gradient(135deg, var(--neon-green), var(--neon-cyan));
            color: #000;
        }
        
        .message.user .message-avatar {
            background: var(--neon-purple);
            color: #fff;
        }
        
        .message-content {
            max-width: 70%;
            padding: 15px 20px;
            border-radius: 12px;
            font-size: 13px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        
        .message.genesis .message-content {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px 12px 12px 0;
        }
        
        .message.user .message-content {
            background: linear-gradient(135deg, var(--neon-green), var(--neon-cyan));
            color: #000;
            border-radius: 12px 12px 0 12px;
        }
        
        .typing-indicator {
            display: flex;
            gap: 5px;
            padding: 15px 20px;
        }
        
        .typing-dot {
            width: 8px;
            height: 8px;
            background: var(--neon-green);
            border-radius: 50%;
            animation: typing 1s infinite;
        }
        
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes typing {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1); }
        }
        
        .chat-input-area {
            background: var(--panel-bg);
            border-top: 1px solid var(--border-color);
            padding: 20px;
        }
        
        .input-container {
            display: flex;
            gap: 15px;
            align-items: flex-end;
        }
        
        .chat-input {
            flex: 1;
            background: var(--dark-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px 20px;
            color: #fff;
            font-family: inherit;
            font-size: 14px;
            resize: none;
            min-height: 50px;
            max-height: 150px;
            transition: all 0.3s;
        }
        
        .chat-input:focus {
            outline: none;
            border-color: var(--neon-green);
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.1);
        }
        
        .send-btn {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--neon-green), var(--neon-cyan));
            border: none;
            border-radius: 12px;
            color: #000;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: all 0.3s;
        }
        
        .send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
        }
        
        .status-bar {
            background: var(--panel-bg);
            border-top: 1px solid var(--border-color);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #666;
        }
        
        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--neon-green);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        .system-message {
            text-align: center;
            padding: 15px;
            color: var(--neon-green);
            font-size: 12px;
            border: 1px dashed var(--border-color);
            border-radius: 8px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="scan-line"></div>
    
    <div class="app-container">
        <div class="sidebar">
            <div class="sidebar-logo">Ω</div>
            <div class="sidebar-nav">
                <a href="/chat" class="nav-item active" title="Chat">💬</a>
                <a href="/dashboard" class="nav-item" title="Dashboard">📊</a>
                <a href="/settings" class="nav-item" title="Settings">⚙️</a>
                <a href="/logout" class="nav-item" title="Logout">🚪</a>
            </div>
        </div>
        
        <div class="main-area">
            <div class="chat-header">
                <div class="chat-info">
                    <div class="chat-avatar">Ω</div>
                    <div class="chat-details">
                        <h2>Genesis Protocol</h2>
                        <span>● Online | Groq LLama</span>
                    </div>
                </div>
                <div class="header-actions">
                    <button class="header-btn" onclick="location.reload()" title="New Chat">🆕</button>
                    <button class="header-btn" title="Settings">⚙️</button>
                </div>
            </div>
            
            <div class="chat-messages" id="messages">
                <div class="system-message">
                    ● Connected to Genesis Protocol v2.0
                </div>
            </div>
            
            <div class="chat-input-area">
                <div class="input-container">
                    <textarea class="chat-input" id="messageInput" placeholder="Type your message..." rows="1"></textarea>
                    <button class="send-btn" onclick="sendMessage()">▶</button>
                </div>
            </div>
            
            <div class="status-bar">
                <div class="status-item">
                    <span class="status-dot"></span>
                    <span>WebSocket Connected</span>
                </div>
                <div class="status-item">
                    <span>Model: Groq LLama-3</span>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const messagesContainer = document.getElementById('messages');
        const messageInput = document.getElementById('messageInput');
        
        messageInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        
        function addMessage(role, content) {
            const div = document.createElement('div');
            div.className = 'message ' + role;
            const avatar = role === 'genesis' ? 'Ω' : 'ME';
            div.innerHTML = '<div class="message-avatar">' + avatar + '</div><div class="message-content"></div>';
            div.querySelector('.message-content').textContent = content;
            messagesContainer.appendChild(div);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
        
        function addTyping() {
            const div = document.createElement('div');
            div.className = 'message genesis';
            div.id = 'typing';
            div.innerHTML = '<div class="message-avatar">Ω</div><div class="message-content"><div class="typing-indicator"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div></div>';
            messagesContainer.appendChild(div);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
        
        function removeTyping() {
            const typing = document.getElementById('typing');
            if (typing) typing.remove();
        }
        
        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;
            
            addMessage('user', text);
            messageInput.value = '';
            addTyping();
            
            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                
                removeTyping();
                
                if (response.ok) {
                    const data = await response.json();
                    addMessage('genesis', data.response || data.message || 'Response received');
                } else {
                    addMessage('genesis', 'Error: ' + response.statusText);
                }
            } catch (error) {
                removeTyping();
                addMessage('genesis', 'Connection error. Please try again.');
            }
        }
        
        // Welcome message
        setTimeout(() => {
            addMessage('genesis', 'Genesis Protocol v2.0 initialized.\n\nI am your autonomous AI assistant. How can I help you today?');
        }, 500);
    </script>
</body>
</html>
