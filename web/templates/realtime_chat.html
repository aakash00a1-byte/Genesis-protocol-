{% extends "base.html" %}

{% block title %}Chat - Genesis Protocol{% endblock %}

{% block content %}
<div class="chat-container">
    <div class="chat-header">
        <h1>🤖 Genesis Protocol Chat</h1>
        <div class="user-info">
            <span>Welcome, {{ session.username }}</span>
            <a href="/dashboard" class="btn-small">📊 Dashboard</a>
            <a href="/logout" class="btn-small">Logout</a>
        </div>
    </div>
    
    <div class="chat-messages" id="chatMessages">
        <div class="welcome-message">
            <p>👋 Welcome to Genesis Protocol AI Chat!</p>
            <p>Ask me anything - I'm here to help!</p>
        </div>
    </div>
    
    <div class="chat-input-area">
        <select id="modeSelect" class="mode-select">
            <option value="NORMAL">Normal Mode</option>
            <option value="AUTONOMOUS">Autonomous Mode</option>
        </select>
        <input type="text" id="messageInput" placeholder="Type your message..." autocomplete="off">
        <button id="sendBtn" onclick="sendMessage()">Send</button>
    </div>
</div>

<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
<script>
const socket = io();
const messagesDiv = document.getElementById('chatMessages');
const messageInput = document.getElementById('messageInput');
const sendBtn = document.getElementById('sendBtn');
const modeSelect = document.getElementById('modeSelect');

let isStreaming = false;
let currentResponseDiv = null;

// Connection status
socket.on('connect', () => {
    console.log('Connected to server');
    addSystemMessage('Connected to chat server', 'success');
});

socket.on('disconnect', () => {
    console.log('Disconnected');
    addSystemMessage('Disconnected from server', 'error');
});

socket.on('connected', (data) => {
    addSystemMessage(`Logged in as ${data.username}`, 'success');
});

socket.on('status', (data) => {
    if (data.status === 'thinking') {
        currentResponseDiv = addMessage('assistant', 'AI is thinking...');
    } else if (data.status === 'done') {
        if (currentResponseDiv) {
            currentResponseDiv.classList.remove('typing');
        }
    }
});

socket.on('stream', (data) => {
    if (currentResponseDiv) {
        currentResponseDiv.classList.remove('typing');
        currentResponseDiv.textContent += data.chunk;
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }
});

socket.on('error', (data) => {
    addSystemMessage(data.error, 'error');
    isStreaming = false;
    sendBtn.disabled = false;
});

function addMessage(role, content) {
    const div = document.createElement('div');
    div.className = `message ${role === 'user' ? 'user-message' : 'assistant-message'}`;
    div.textContent = content;
    messagesDiv.appendChild(div);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
    return div;
}

function addSystemMessage(message, type) {
    const div = document.createElement('div');
    div.className = `system-message ${type}`;
    div.textContent = message;
    messagesDiv.appendChild(div);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

function sendMessage() {
    const message = messageInput.value.trim();
    if (!message || isStreaming) return;
    
    isStreaming = true;
    sendBtn.disabled = true;
    
    // Add user message
    addMessage('user', message);
    messageInput.value = '';
    
    // Send to server
    socket.emit('chat_message', {
        message: message,
        mode: modeSelect.value
    });
    
    // Reset after timeout
    setTimeout(() => {
        isStreaming = false;
        sendBtn.disabled = false;
    }, 60000);
}

// Handle Enter key
messageInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
        sendMessage();
    }
});

// Load history
fetch('/api/chat/history')
    .then(r => r.json())
    .then(data => {
        if (data.chats && data.chats.length > 0) {
            addSystemMessage('Loading chat history...', 'info');
            data.chats.reverse().slice(-10).forEach(chat => {
                addMessage('user', chat.message);
                addMessage('assistant', chat.response);
            });
        }
    })
    .catch(err => console.log('No history available'));
</script>

<style>
.chat-container {
    max-width: 900px;
    margin: 0 auto;
    height: calc(100vh - 100px);
    display: flex;
    flex-direction: column;
}

.chat-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1rem;
    background: var(--card-bg);
    border-radius: 12px 12px 0 0;
}

.chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 1rem;
    background: var(--bg-secondary);
}

.message {
    padding: 1rem;
    margin: 0.5rem 0;
    border-radius: 12px;
    max-width: 85%;
    white-space: pre-wrap;
    word-wrap: break-word;
}

.user-message {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    margin-left: auto;
}

.assistant-message {
    background: var(--card-bg);
    border: 1px solid var(--border);
}

.assistant-message.typing::after {
    content: '...';
    animation: dots 1s infinite;
}

@keyframes dots {
    0%, 20% { content: '.'; }
    40% { content: '..'; }
    60%, 100% { content: '...'; }
}

.system-message {
    text-align: center;
    font-size: 0.85rem;
    padding: 0.5rem;
    margin: 0.25rem;
    border-radius: 8px;
}

.system-message.success { color: #10b981; }
.system-message.error { color: #ef4444; }
.system-message.info { color: #6b7280; }

.welcome-message {
    text-align: center;
    padding: 2rem;
    color: var(--text-secondary);
}

.chat-input-area {
    display: flex;
    gap: 0.5rem;
    padding: 1rem;
    background: var(--card-bg);
    border-radius: 0 0 12px 12px;
}

.mode-select {
    padding: 0.75rem;
    border-radius: 8px;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    color: var(--text);
}

#messageInput {
    flex: 1;
    padding: 0.75rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg-secondary);
    color: var(--text);
}

#sendBtn {
    padding: 0.75rem 1.5rem;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
}

#sendBtn:hover { opacity: 0.9; }
#sendBtn:disabled { opacity: 0.5; cursor: not-allowed; }

.btn-small {
    padding: 0.5rem 1rem;
    font-size: 0.85rem;
    text-decoration: none;
    background: var(--bg-secondary);
    border-radius: 6px;
    margin-left: 0.5rem;
}
</style>
{% endblock %}
