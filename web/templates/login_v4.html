{% extends "base_v4.html" %}

{% block title %}Login - Gluttony OS v4{% endblock %}

{% block header_title %}{% endblock %}

{% block content %}
<div class="auth-container" style="background: transparent;">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo">⚡</div>
            <h1 class="auth-title">Welcome Back</h1>
            <p class="auth-subtitle">Sign in to your Genesis account</p>
        </div>
        
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label class="form-label">Username or Email</label>
                <input type="text" class="form-input" id="username" name="username" 
                       placeholder="Enter your username" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" class="form-input" id="password" name="password" 
                       placeholder="Enter your password" required>
            </div>
            
            <div id="errorMessage" class="form-error" style="display: none;"></div>
            
            <button type="submit" class="btn btn-primary auth-btn" id="submitBtn">
                Sign In
            </button>
        </form>
        
        <div class="auth-footer">
            <a href="/forgot-password">Forgot Password?</a>
            <span style="margin: 0 12px; color: var(--text-muted);">|</span>
            <a href="/register">Create Account</a>
        </div>
    </div>
</div>

<script>
async function handleLogin(event) {
    event.preventDefault();
    
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const errorMsg = document.getElementById('errorMessage');
    const submitBtn = document.getElementById('submitBtn');
    
    submitBtn.disabled = true;
    submitBtn.textContent = 'Signing in...';
    errorMsg.style.display = 'none';
    
    try {
        const response = await fetch('/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username, password})
        });
        
        const data = await response.json();
        
        if (data.success) {
            window.location.href = data.redirect || '/chat';
        } else {
            errorMsg.textContent = data.error || 'Invalid credentials';
            errorMsg.style.display = 'block';
            submitBtn.disabled = false;
            submitBtn.textContent = 'Sign In';
        }
    } catch (err) {
        errorMsg.textContent = 'Connection error. Please try again.';
        errorMsg.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
    }
}
</script>
{% endblock %}
