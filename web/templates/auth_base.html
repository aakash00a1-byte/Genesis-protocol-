<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>{% block title %}GLUTEN{% endblock %}</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%236366f1'/><text x='16' y='23' font-size='20' text-anchor='middle' fill='white' font-family='system-ui'>&#9889;</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
    <style>
        body { display: grid; place-items: center; padding: 24px; }
        .auth-card {
            width: 100%;
            max-width: 400px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            padding: 34px 30px;
            box-shadow: var(--shadow-lg);
        }
        .auth-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 26px;
        }
        .auth-brand .brand-mark {
            width: 42px; height: 42px;
            display: grid; place-items: center;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent), #8b5cf6);
            font-size: 19px;
        }
        .auth-brand h1 { font-size: 18px; }
        .auth-brand p { font-size: 12.5px; color: var(--text-muted); }
        .auth-title { font-size: 20px; margin-bottom: 6px; }
        .auth-sub { font-size: 13.5px; color: var(--text-muted); margin-bottom: 24px; }
        .auth-alt { margin-top: 20px; font-size: 13.5px; color: var(--text-muted); text-align: center; }
        .auth-foot { margin-top: 26px; font-size: 12px; color: var(--text-faint); text-align: center; }
        .auth-foot a { color: var(--text-muted); }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <main class="auth-card">
        <div class="auth-brand">
            <span class="brand-mark" aria-hidden="true">⚡</span>
            <div>
                <h1>GLUTEN</h1>
                <p>A governed AI agent</p>
            </div>
        </div>
        {% block content %}{% endblock %}
        <p class="auth-foot"><a href="/">← Back to home</a></p>
    </main>
    {% block scripts %}{% endblock %}
</body>
</html>
