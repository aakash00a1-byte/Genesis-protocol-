<style>
.fp-wrap { max-width: 1100px; margin: 0 auto; padding: 20px; }
.fp-hero {
    background: rgba(10, 10, 26, 0.8);
    border: 1px solid #1a1a3a;
    border-radius: 12px;
    padding: 26px 30px;
    margin-bottom: 18px;
}
.fp-hero h2 { color: #00ff9d; margin: 0 0 8px; font-size: 20px; }
.fp-hero p { color: #7070a0; margin: 0; font-size: 13px; }
.fp-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
.fp-btn {
    background: transparent; border: 1px solid #00ff9d; color: #00ff9d;
    padding: 9px 16px; border-radius: 8px; font-family: inherit;
    font-size: 12px; text-transform: uppercase; letter-spacing: 1px; cursor: pointer;
}
.fp-btn:hover { background: rgba(0, 255, 157, 0.1); }
.fp-input {
    background: rgba(0, 5, 10, 0.9); border: 1px solid #1a1a3a; color: #e0e0ff;
    padding: 9px 14px; border-radius: 8px; font-family: inherit; font-size: 13px;
    flex: 1; min-width: 200px;
}
.fp-log {
    background: rgba(0, 5, 10, 0.9); border: 1px solid #00e5ff; border-radius: 12px;
    padding: 16px; font-family: 'JetBrains Mono', monospace; font-size: 12px;
    color: #00e5ff; white-space: pre-wrap; max-height: 420px; overflow-y: auto;
    margin-bottom: 18px;
}
.fp-card {
    background: rgba(10, 10, 26, 0.8); border: 1px solid #1a1a3a;
    border-radius: 12px; padding: 22px; margin-bottom: 16px;
}
.fp-card h3 { color: #00e5ff; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; margin: 0 0 14px; }
.fp-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; }
.fp-item { border: 1px solid #12122a; border-radius: 8px; padding: 12px 14px; }
.fp-item .t { color: #e0e0ff; font-size: 13px; margin-bottom: 4px; }
.fp-item .d { color: #7070a0; font-size: 12px; line-height: 1.5; }
.fp-row { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid #12122a; font-size: 13px; }
.fp-row:last-child { border-bottom: none; }
.fp-row .k { color: #7070a0; }
.fp-row .v { color: #e0e0ff; text-align: right; }
.fp-note { color: #7070a0; font-size: 12px; line-height: 1.6; margin-top: 10px; }
</style>

<div class="fp-wrap">
    <div class="fp-hero">
        <h2>{{ fp_icon }} {{ fp_title }}</h2>
        <p>{{ fp_subtitle }}</p>
    </div>
    {% if fp_static %}{{ fp_static|safe }}{% endif %}
    {% if fp_actions %}
    <div class="fp-actions">
        {% for a in fp_actions %}
        <button class="fp-btn" onclick="fpCall('{{ a.url }}','{{ a.method }}')">{{ a.label }}</button>
        {% endfor %}
    </div>
    <div class="fp-log" id="fp-log">Press a button above to load live data.</div>
    {% endif %}
    {% if fp_extra %}{{ fp_extra|safe }}{% endif %}
</div>

<script>
async function fpCall(url, method) {
    const log = document.getElementById('fp-log');
    if (!log) return;
    log.textContent = method + ' ' + url + ' ...';
    try {
        const opts = { method: method, headers: { 'Content-Type': 'application/json' } };
        if (method === 'POST') opts.body = '{}';
        const res = await fetch(url, opts);
        const data = await res.json();
        log.textContent = JSON.stringify(data, null, 2);
    } catch (e) {
        log.textContent = 'Error: ' + e;
    }
}
</script>
