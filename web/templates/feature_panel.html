<style>
.fp-wrap { display: flex; flex-direction: column; gap: 18px; }
.fp-hero {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 24px 26px;
}
.fp-hero h2 { font-size: 19px; margin-bottom: 6px; }
.fp-hero p { color: var(--text-muted); font-size: 13.5px; line-height: 1.6; }
.fp-actions { display: flex; flex-wrap: wrap; gap: 10px; }
.fp-log {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--text-secondary);
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 420px;
    overflow-y: auto;
    line-height: 1.6;
}
.fp-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 22px;
}
.fp-card h3 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--text-faint);
    margin-bottom: 12px;
}
.fp-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.fp-item { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 13px 15px; }
.fp-item .t { font-size: 13.5px; color: var(--text); margin-bottom: 4px; }
.fp-item .d { font-size: 12.5px; color: var(--text-muted); line-height: 1.5; }
.fp-row {
    display: flex;
    justify-content: space-between;
    gap: 14px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13.5px;
}
.fp-row:last-child { border-bottom: none; }
.fp-row .k { color: var(--text-muted); }
.fp-row .v { color: var(--text); text-align: right; font-family: var(--mono); font-size: 12.5px; }
.fp-note { color: var(--text-muted); font-size: 12.5px; line-height: 1.65; }
</style>

<div class="fp-wrap">
    <div class="fp-hero">
        <h2>{{ fp_icon }} {{ fp_title }}</h2>
        <p>{{ fp_subtitle }}</p>
    </div>

    {% if fp_actions %}
    <div class="fp-actions">
        {% for a in fp_actions %}
        <button class="btn btn-secondary btn-sm" onclick="fpCall('{{ a.url }}','{{ a.method }}')">{{ a.label }}</button>
        {% endfor %}
    </div>
    <div class="fp-log" id="fp-log">Choose an action above to read live data from the running service.</div>
    {% endif %}

    {% if fp_static %}{{ fp_static|safe }}{% endif %}
    {% if fp_extra %}{{ fp_extra|safe }}{% endif %}
</div>

<script>
async function fpCall(url, method) {
    const log = document.getElementById('fp-log');
    if (!log) return;
    log.textContent = method + ' ' + url + ' …';
    try {
        const opts = { method: method, headers: { 'Accept': 'application/json' } };
        if (method === 'POST') {
            opts.headers['Content-Type'] = 'application/json';
            opts.body = '{}';
        }
        const res = await fetch(url, opts);
        let data;
        try {
            data = await res.json();
        } catch (e) {
            data = { status: res.status, note: 'response was not JSON' };
        }
        log.textContent = 'HTTP ' + res.status + '\n' + JSON.stringify(data, null, 2);
    } catch (e) {
        log.textContent = 'Request failed: ' + e;
    }
}
</script>
