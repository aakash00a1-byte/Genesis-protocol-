<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Genesis Protocol</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --neon-green: #00ff9d;
            --neon-cyan: #00e5ff;
            --neon-purple: #bf00ff;
            --neon-blue: #0066ff;
            --dark-bg: #000000;
            --panel-bg: #050510;
            --border-color: #1a1a3a;
            --glow-green: 0 0 20px rgba(0, 255, 157, 0.5), 0 0 40px rgba(0, 255, 157, 0.3);
            --glow-cyan: 0 0 20px rgba(0, 229, 255, 0.5), 0 0 40px rgba(0, 229, 255, 0.3);
            --ocean-gradient: linear-gradient(135deg, #000011 0%, #000033 50%, #001122 100%);
        }
        
        body {
            font-family: 'JetBrains Mono', monospace;
            background: var(--ocean-gradient);
            color: #e0e0ff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }
        
        /* Ocean Grid Background */
        .grid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 229, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 229, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }
        
        /* Vignette */
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, transparent 0%, rgba(0,0,0,0.6) 100%);
            pointer-events: none;
            z-index: 1;
        }
        
        /* Scan Line */
        .scan-line {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon-cyan), var(--neon-purple), transparent);
            animation: scan 6s linear infinite;
            opacity: 0.3;
            pointer-events: none;
            z-index: 9999;
        }
        
        @keyframes scan {
            0% { top: 0; opacity: 0.4; }
            50% { opacity: 0.2; }
            100% { top: 100%; opacity: 0.4; }
        }
        
        /* Floating Particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }
        
        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: var(--neon-cyan);
            border-radius: 50%;
            animation: float 20s infinite;
            opacity: 0.5;
            box-shadow: 0 0 10px var(--neon-cyan);
        }
        
        .particle:nth-child(2) { left: 20%; animation-delay: 2s; background: var(--neon-purple); }
        .particle:nth-child(3) { left: 40%; animation-delay: 1s; background: var(--neon-green); }
        .particle:nth-child(4) { left: 60%; animation-delay: 3s; }
        .particle:nth-child(5) { left: 80%; animation-delay: 0.5s; background: var(--neon-purple); }
        
        @keyframes float {
            0%, 100% { transform: translateY(100vh) translateX(0); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { transform: translateY(-100vh) translateX(50px); opacity: 0; }
        }
        
        .login-container {
            width: 100%;
            max-width: 450px;
            position: relative;
            z-index: 10;
        }
        
        .logo-section {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo-text {
            color: var(--neon-green);
            font-size: 28px;
            font-weight: bold;
            text-shadow: var(--glow-green);
            animation: pulse-glow 3s ease-in-out infinite;
        }
        
        @keyframes pulse-glow {
            0%, 100% { text-shadow: 0 0 20px rgba(0, 255, 157, 0.5); }
            50% { text-shadow: 0 0 40px rgba(0, 255, 157, 0.8), 0 0 60px rgba(0, 255, 157, 0.4); }
        }
        
        .logo-subtitle {
            color: #7070a0;
            font-size: 12px;
            margin-top: 8px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        
        .terminal-box {
            background: rgba(5, 5, 16, 0.95);
            border: 1px solid var(--neon-cyan);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 60px rgba(0, 229, 255, 0.2), 0 0 100px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
        }
        
        .terminal-header {
            background: linear-gradient(90deg, var(--neon-purple), var(--neon-cyan), var(--neon-green));
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            box-shadow: 0 0 10px currentColor;
        }
        
        .dot.red { background: #ff5f56; color: #ff5f56; }
        .dot.yellow { background: #ffbd2e; color: #ffbd2e; }
        .dot.green { background: #27ca40; color: #27ca40; }
        
        .terminal-title {
            color: #000;
            font-weight: bold;
            font-size: 12px;
            margin-left: auto;
            text-shadow: none;
        }
        
        .terminal-body {
            padding: 30px;
        }
        
        .error-msg {
            background: rgba(255, 0, 51, 0.15);
            border: 1px solid #ff0033;
            color: #ff0033;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 12px;
            text-align: center;
            box-shadow: 0 0 20px rgba(255, 0, 51, 0.3);
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        .input-label {
            display: block;
            color: var(--neon-cyan);
            font-size: 11px;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
        }
        
        .input-field {
            width: 100%;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 14px 16px;
            color: #e0e0ff;
            font-family: inherit;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .input-field:focus {
            outline: none;
            border-color: var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.4), inset 0 0 10px rgba(0, 229, 255, 0.1);
        }
        
        .input-field::placeholder {
            color: #404060;
        }
        
        .btn-primary {
            width: 100%;
            background: linear-gradient(135deg, var(--neon-green), var(--neon-cyan));
            color: #000;
            border: none;
            padding: 16px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 0 30px rgba(0, 255, 157, 0.4);
        }
        
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 50px rgba(0, 255, 157, 0.6), 0 0 80px rgba(0, 255, 157, 0.3);
        }
        
        .links-row {
            display: flex;
            justify-content: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }
        
        .link {
            color: var(--neon-cyan);
            text-decoration: none;
            font-size: 12px;
            transition: all 0.3s;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
        }
        
        .link:hover {
            color: var(--neon-green);
            text-shadow: 0 0 20px rgba(0, 255, 157, 0.5);
        }
    </style>
</head>
<body>
    <div class="grid-bg"></div>
    <div class="vignette"></div>
    <div class="scan-line"></div>
    <div class="particles">
        <div class="particle" style="left: 10%;"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>
    
    <div class="login-container">
        <div class="logo-section">
            <div class="logo-text">GENESIS Ω</div>
            <div class="logo-subtitle">Autonomous AI Protocol</div>
        </div>
        
        <div class="terminal-box">
            <div class="terminal-header">
                <div class="dot red"></div>
                <div class="dot yellow"></div>
                <div class="dot green"></div>
                <span class="terminal-title">auth@genesis:~</span>
            </div>
            
            <div class="terminal-body">
                {% if error %}
                <div class="error-msg">{{ error }}</div>
                {% endif %}
                
                <form method="POST">
                    <div class="input-group">
                        <label class="input-label">Username</label>
                        <input type="text" name="username" class="input-field" placeholder="Enter username" required autofocus>
                    </div>
                    
                    <div class="input-group">
                        <label class="input-label">Password</label>
                        <input type="password" name="password" class="input-field" placeholder="Enter password" required>
                    </div>
                    
                    <button type="submit" class="btn-primary">▶ ACCESS SYSTEM</button>
                </form>
                
                <div class="links-row">
                    <a href="/register" class="link">New User? Create Account</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
