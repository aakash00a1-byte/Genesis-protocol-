<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Genesis Protocol</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --neon-green: #00ff88;
            --neon-cyan: #00d4ff;
            --neon-purple: #a855f7;
            --dark-bg: #0a0a0f;
            --panel-bg: #111122;
            --border-color: #1a1a2e;
        }
        
        body {
            font-family: 'JetBrains Mono', monospace;
            background: var(--dark-bg);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .scan-line {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--neon-green);
            animation: scan 4s linear infinite;
            opacity: 0.2;
            pointer-events: none;
            z-index: 9999;
        }
        
        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }
        
        .login-container {
            width: 100%;
            max-width: 450px;
        }
        
        .logo-section {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo-text {
            color: var(--neon-green);
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 20px var(--neon-green);
        }
        
        .logo-subtitle {
            color: #666;
            font-size: 12px;
            margin-top: 5px;
        }
        
        .terminal-box {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 60px rgba(0, 255, 136, 0.1);
        }
        
        .terminal-header {
            background: linear-gradient(90deg, var(--neon-green), var(--neon-cyan));
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        
        .dot.red { background: #ff5f56; }
        .dot.yellow { background: #ffbd2e; }
        .dot.green { background: #27ca40; }
        
        .terminal-title {
            color: #000;
            font-weight: bold;
            font-size: 12px;
            margin-left: auto;
        }
        
        .terminal-body {
            padding: 30px;
        }
        
        .error-msg {
            background: rgba(255, 68, 68, 0.1);
            border: 1px solid #ff4444;
            color: #ff4444;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 12px;
            text-align: center;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        .input-label {
            display: block;
            color: #888;
            font-size: 11px;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .input-field {
            width: 100%;
            background: var(--dark-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 14px 16px;
            color: #fff;
            font-family: inherit;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .input-field:focus {
            outline: none;
            border-color: var(--neon-green);
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.2);
        }
        
        .btn-primary {
            width: 100%;
            background: linear-gradient(135deg, var(--neon-green), var(--neon-cyan));
            color: #000;
            border: none;
            padding: 16px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 30px rgba(0, 255, 136, 0.4);
        }
        
        .links-row {
            display: flex;
            justify-content: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }
        
        .link {
            color: var(--neon-cyan);
            text-decoration: none;
            font-size: 12px;
            transition: color 0.3s;
        }
        
        .link:hover {
            color: var(--neon-green);
        }
    </style>
</head>
<body>
    <div class="scan-line"></div>
    
    <div class="login-container">
        <div class="logo-section">
            <div class="logo-text">GENESIS Ω</div>
            <div class="logo-subtitle">Autonomous AI Protocol</div>
        </div>
        
        <div class="terminal-box">
            <div class="terminal-header">
                <div class="dot red"></div>
                <div class="dot yellow"></div>
                <div class="dot green"></div>
                <span class="terminal-title">auth@genesis:~</span>
            </div>
            
            <div class="terminal-body">
                {% if error %}
                <div class="error-msg">{{ error }}</div>
                {% endif %}
                
                <form method="POST">
                    <div class="input-group">
                        <label class="input-label">Username</label>
                        <input type="text" name="username" class="input-field" placeholder="Enter username" required autofocus>
                    </div>
                    
                    <div class="input-group">
                        <label class="input-label">Password</label>
                        <input type="password" name="password" class="input-field" placeholder="Enter password" required>
                    </div>
                    
                    <button type="submit" class="btn-primary">▶ ACCESS SYSTEM</button>
                </form>
                
                <div class="links-row">
                    <a href="/register" class="link">New User? Create Account</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
