{% extends "auth_base.html" %}

{% block title %}Sign in — GLUTEN{% endblock %}

{% block content %}
<h2 class="auth-title">Sign in</h2>
<p class="auth-sub">Access your workspace.</p>

{% if error %}
<div class="badge danger" style="display:block; padding:10px 14px; margin-bottom:18px;">{{ error }}</div>
{% endif %}

<form method="POST" autocomplete="on">
    <div class="field">
        <label for="username">Username</label>
        <input class="input" type="text" id="username" name="username"
               placeholder="your username" required autofocus autocomplete="username">
    </div>
    <div class="field">
        <label for="password">Password</label>
        <input class="input" type="password" id="password" name="password"
               placeholder="your password" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn btn-primary" style="width:100%;">Sign in</button>
</form>

<p class="auth-alt">No account? <a href="/register">Create one</a></p>
{% endblock %}
