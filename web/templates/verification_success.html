{% extends "base.html" %}

{% block title %}Email Verified - Genesis AI{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card" style="text-align: center; padding: 60px;">
        <div style="font-size: 80px; margin-bottom: 20px;">✅</div>
        <h1 style="color: var(--success); margin-bottom: 20px;">Email Verified!</h1>
        <p style="color: var(--text-secondary); margin-bottom: 30px;">
            Your email has been successfully verified. You're now ready to use Genesis AI!
        </p>
        <a href="/login" class="btn btn-primary" style="display: inline-block; padding: 14px 28px;">
            Start Chatting
        </a>
    </div>
</div>
{% endblock %}
