# Render Blueprint for Genesis Web Platform
# Deploy to Render: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: genesis-ai-web
    env: python
    buildCommand: cd web && pip install -r requirements.txt
    startCommand: cd web && python3 app_v3.py
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        value: genesis-admin-2024
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: PYTHONUNBUFFERED
        value: "true"