name: Genesis Self-Improvement

# Gives the agent a continuous job: keep improving the Genesis repository.
#
# A long-running loop (like the Telegram relay): each cycle starts ONE OpenHands
# Cloud conversation that makes a single small, safe change on its own branch,
# then this harness lands the result as a pull request and pings Telegram.
# Nothing reaches main until the owner approves: the owner replies /approve in
# Telegram, the harness merges the PR (that merge is the push) and then asks the
# deploy workflow to run. So the owner decides, and only then does it ship.
#
# Requires the repo secret OPENHANDS_API_KEY. No other token is needed: the
# workflow grants its own GITHUB_TOKEN contents/pull-requests/actions write, so
# push, PR and merge all work. Set AGENT_GH_TOKEN only if the repo is pinned to
# read-only for Actions. A scheduled run lasts ~5h30m; cron fires every 4h so
# the loop is continuous.

on:
  schedule:
    # Every 4 hours, so the ~5h30m run overlaps and never leaves a gap.
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      once:
        description: 'Run exactly one improvement cycle and exit'
        type: boolean
        default: false
      approvals_only:
        description: 'Only process pending /approve commands and exit'
        type: boolean
        default: false

concurrency:
  group: genesis-self-improve
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # Needed to dispatch deploy-space.yml explicitly after a merge: a push made
  # with GITHUB_TOKEN does not trigger another workflow, so the loop asks for
  # the deploy by name instead. Creating a workflow dispatch needs actions:write.
  actions: write

jobs:
  self-improve:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.AGENT_GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure git
        env:
          GH_TOKEN_FOR_PUSH: ${{ secrets.AGENT_GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "openhands"
          git config user.email "openhands@all-hands.dev"
          git remote set-url origin "https://x-access-token:${GH_TOKEN_FOR_PUSH}@github.com/${{ github.repository }}.git"

      - name: Check required secrets
        env:
          OPENHANDS_API_KEY: ${{ secrets.OPENHANDS_API_KEY }}
          AGENT_GH_TOKEN: ${{ secrets.AGENT_GH_TOKEN }}
        run: |
          if [ -z "$OPENHANDS_API_KEY" ]; then
            echo "::error::OPENHANDS_API_KEY secret is not set; cannot start the agent."
            exit 1
          fi
          if [ -z "$AGENT_GH_TOKEN" ]; then
            echo "::notice::AGENT_GH_TOKEN not set; using the default GITHUB_TOKEN. That is fine: this workflow grants contents/pull-requests/actions write, which covers push, PR and the merge (/approve)."
          fi

      - name: Run the continuous self-improvement loop
        env:
          OPENHANDS_API_KEY: ${{ secrets.OPENHANDS_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.AGENT_GH_TOKEN || secrets.GITHUB_TOKEN }}
          # Approval (merge) uses the same token as push. The default
          # GITHUB_TOKEN is enough when the repo allows write for Actions; a
          # PAT (AGENT_GH_TOKEN) is only needed if the repo is read-only.
          GH_MERGE_TOKEN: ${{ secrets.AGENT_GH_TOKEN || secrets.GITHUB_TOKEN }}
          HF_SPACE_URL: https://genesisno-genesis-automaton.hf.space
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          SELF_IMPROVE_REPO: ${{ github.repository }}
          SELF_IMPROVE_BRANCH: main
          SELF_IMPROVE_INTERVAL_SECONDS: "2700"
          SELF_IMPROVE_RUN_SECONDS: "19800"
          SELF_IMPROVE_MAX_OPEN_PRS: "5"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
        run: |
          if [ "${{ inputs.approvals_only }}" = "true" ]; then
            python3 scripts/self_improve.py --approvals-only
          elif [ "${{ inputs.once }}" = "true" ]; then
            python3 scripts/self_improve.py --once
          else
            python3 scripts/self_improve.py
          fi

