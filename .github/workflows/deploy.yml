name: Deploy to Railway

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: |
          mkdir -p ~/.railway/bin
          curl -fsSL https://railway.app/install.sh -o /tmp/install.sh
          bash /tmp/install.sh

      - name: Configure Railway Token
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        run: |
          mkdir -p ~/.railway
          cat > ~/.railway/config.json << EOF
{
  "projects": {"$RAILWAY_PROJECT_ID": {"id": "$RAILWAY_PROJECT_ID"}},
  "user": {
    "id": "d8357c3c-f263-4922-a4a4-927db003cbba",
    "accessToken": "$RAILWAY_TOKEN"
  }
}
EOF

      - name: Deploy
        run: |
          export PATH="$HOME/.railway/bin:$PATH"
          railway up --service bot
