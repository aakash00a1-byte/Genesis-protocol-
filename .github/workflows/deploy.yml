name: Deploy to Railway

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: |
          mkdir -p ~/.railway/bin
          curl -fsSL https://railway.app/install.sh -o /tmp/install.sh
          bash /tmp/install.sh

      - name: Configure Railway Token
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          mkdir -p ~/.railway
          echo '{"user":{"accessToken":"'$RAILWAY_TOKEN'"}}' > ~/.railway/config.json

      - name: Deploy
        run: |
          export PATH="$HOME/.railway/bin:$PATH"
          railway up --service bot
