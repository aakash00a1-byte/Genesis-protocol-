name: Deploy to Railway

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Railway Login
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway login --token $RAILWAY_TOKEN

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway link ${{ secrets.RAILWAY_PROJECT_ID }}
          railway up --service web
          railway variables set GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          railway variables set OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          railway variables set TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          railway variables set SECRET_KEY=${{ secrets.SECRET_KEY }}
          railway variables set ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}