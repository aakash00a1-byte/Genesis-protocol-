name: Relay Self-Test

# Answers one question in under a minute: does the Actions relay actually get
# past the Space's shared-secret check? A 401 here means TELEGRAM_WEBHOOK_SECRET
# in the repo does not match the Space, and every queued reply is being dropped.
#
# This exists because that failure is otherwise invisible: the relay retries a
# 401 silently for 5h30m, and its log is only readable once the job ends.

on:
  workflow_dispatch:
    inputs:
      send_test_message:
        description: Send a test message to the admin on Telegram
        type: boolean
        default: false
      probe_ai:
        description: Post a synthetic webhook update and check an AI reply is queued
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/relay-selftest.yml'

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe the Space queue and Telegram
        env:
          HF_SPACE_URL: https://genesisno-genesis-automaton.hf.space
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          SEND_TEST_MESSAGE: ${{ inputs.send_test_message }}
          PROBE_AI: ${{ inputs.probe_ai }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          space = os.environ["HF_SPACE_URL"].rstrip("/")
          secret = os.environ.get("TELEGRAM_WEBHOOK_SECRET", "").strip()
          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          admin = os.environ.get("TELEGRAM_ADMIN_ID", "").strip()

          def call(url, headers=None, payload=None, timeout=30):
              data = json.dumps(payload).encode() if payload is not None else None
              req = urllib.request.Request(url, data=data, headers=headers or {})
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as resp:
                      return resp.status, resp.read()
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.read()
              except Exception as exc:
                  return None, str(exc).encode()

          headers = {"Accept": "application/json"}
          if secret:
              headers["X-Telegram-Bot-Api-Secret-Token"] = secret

          status, body = call(f"{space}/api/telegram/queue", headers)
          print(f"queue endpoint  -> HTTP {status}")
          if status == 401:
              print("RESULT: FAIL - the repo secret does not match the Space.")
              print("Every queued reply is being discarded. Set the repo secret")
              print("TELEGRAM_WEBHOOK_SECRET to the Space's value and re-run.")
              raise SystemExit(1)
          if status != 200:
              print(f"RESULT: FAIL - unexpected status. Body: {body[:200]!r}")
              raise SystemExit(1)
          try:
              payload = json.loads(body)
              print(f"RESULT: OK - relay authenticated; {payload.get('count', 0)} "
                    "reply/replies waiting.")
          except Exception:
              print("RESULT: OK - relay authenticated (queue body not JSON).")

          if token:
              status, body = call(f"https://api.telegram.org/bot{token}/getMe")
              print(f"telegram getMe  -> HTTP {status} {body[:120].decode(errors='replace')}")

          # Post a synthetic owner message and confirm the Space queues an AI
          # reply. This exercises the full inbound path: secret check, provider
          # chain, and queue write. Without it a reply can fail with "All
          # providers failed" and nothing else would reveal it.
          if os.environ.get("PROBE_AI") == "true" and secret and admin:
              import time
              marker = f"selftest{int(time.time())}"
              update = {
                  "update_id": 1,
                  "message": {
                      "message_id": 1,
                      "chat": {"id": int(admin)},
                      "from": {"id": int(admin), "first_name": "selftest"},
                      "text": f"Reply with exactly this word and nothing else: {marker}",
                  },
              }
              status, body = call(
                  f"{space}/api/telegram/webhook",
                  {**headers, "Content-Type": "application/json"},
                  update,
              )
              print(f"webhook post    -> HTTP {status} {body[:120].decode(errors='replace')}")
              if status != 200:
                  print("RESULT: FAIL - the Space rejected a well-formed webhook update.")
                  raise SystemExit(1)
              # The handler answers synchronously, so the reply is queued by the
              # time the POST returns. Read once, immediately; the live relay
              # clears the queue every 60s, so a later poll could miss it.
              time.sleep(3)
              status, body = call(f"{space}/api/telegram/queue", headers)
              if status != 200:
                  print(f"RESULT: FAIL - queue read returned HTTP {status}.")
                  raise SystemExit(1)
              replies = json.loads(body).get("replies", [])
              texts = [str(r.get("text", "")) for r in replies]
              bad = [t for t in texts if "All providers failed" in t or t.startswith("❌")]
              if bad:
                  print(f"RESULT: FAIL - AI reply errored: {bad[0][:220]}")
                  raise SystemExit(1)
              if not texts:
                  # Empty queue is not a failure: the relay may have delivered
                  # the reply already. It only means this probe saw nothing.
                  print("RESULT: OK - no reply pending (the relay likely "
                        "delivered it; check Telegram).")
              else:
                  print(f"RESULT: OK - AI queued a reply: {texts[-1][:140]}")
          PY
