name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install flake8

    - name: Lint with flake8
      run: |
        flake8 genesis_protocol --count --select=E9,F63,F7,F82 --show-source --statistics

  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pytest

    - name: Prepare the sandbox layout the V6 suite asserts
      # The V6 kernel is container-first: its sandbox root is /workspace and
      # several tests read /workspace/project/... . A bind mount (not a symlink
      # — the sandbox resolves symlinks with realpath on purpose) puts this
      # checkout exactly there so both suites can run.
      run: |
        sudo mkdir -p /workspace/project
        sudo mount --bind "$GITHUB_WORKSPACE" /workspace/project

    - name: Run test suite
      # No path argument: pyproject testpaths covers both tests/ and
      # genesis_v5/tests/. Pinning only tests/ left 390 real tests unrun, so
      # genuinely-tested code could be reported (and believed) as untested.
      run: python -m pytest -q

