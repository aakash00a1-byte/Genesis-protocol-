name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install flake8

    - name: Lint with flake8
      run: |
        flake8 genesis_protocol --count --select=E9,F63,F7,F82 --show-source --statistics

  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pytest

    - name: Prepare the sandbox root the V6 suite expects
      # The kernel's sandbox root is /workspace; the suite needs the directory to
      # exist (creating it needs root). genesis_v5/tests/conftest.py points
      # /workspace/project at whatever checkout is running, so it also works in
      # the self-improve gate's scratch worktree.
      run: |
        sudo mkdir -p /workspace
        sudo chmod 777 /workspace

    - name: Run test suite
      # No path argument: pyproject testpaths covers both tests/ and
      # genesis_v5/tests/. Pinning only tests/ left 390 real tests unrun, so
      # genuinely-tested code could be reported (and believed) as untested.
      run: python -m pytest -q

