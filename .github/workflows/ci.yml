name: CI/CD

# `workflow_dispatch` is not a convenience here, it is required. When the
# self-improvement harness opens a PR it authenticates with the default
# GITHUB_TOKEN, and GitHub suppresses the events that token creates to prevent
# workflow loops. So `pull_request` never fires for an agent PR and the PR shows
# no checks at all (verified: every github-actions[bot] PR had 0 check runs,
# every human PR had 2). `workflow_dispatch` is the documented exception that
# always creates a run regardless of which token asked, so the harness asks for
# CI by name. Keep this trigger.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install flake8

    - name: Lint with flake8
      run: |
        flake8 genesis_protocol --count --select=E9,F63,F7,F82 --show-source --statistics

  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pytest

    - name: Run test suite
      run: python -m pytest tests/ -q

