name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install flake8

    - name: Lint with flake8
      run: |
        flake8 genesis_protocol --count --select=E9,F63,F7,F82 --show-source --statistics

  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pytest

    - name: Run test suite
      # One source of truth for how the suite is run (scripts/verify_all.sh),
      # shared with the self-improve gate. It provides the container layout the
      # V6 kernel asserts and then runs both suites. Pinning only tests/ left 390
      # real tests unrun, so genuinely-tested code could be reported (and
      # believed) as untested.
      run: bash scripts/verify_all.sh

