name: Genesis Daily Heartbeat

# Sends the admin one proactive status message per day, so Genesis reports in
# on its own without the admin having to message it first. Delivery goes
# through scripts/relay_loop.py's heartbeat mode (the HF Space itself cannot
# reach api.telegram.org).
#
# The daily heartbeat is sent by this workflow's schedule. It used to rely on
# the in-run heartbeat (RELAY_HEARTBEAT_HOURS=24) inside keepalive.yml, but a
# relay run lasts only RELAY_RUN_SECONDS=19800 (5h30m), so a 24h interval could
# never elapse and no heartbeat was ever sent. With no cron here either, the
# documented daily heartbeat did not exist at all.
#
# GitHub Actions cron is UTC, so 03:30 UTC matches the documented time.
# `concurrency` below serialises sends, so a manual dispatch cannot land next to
# the scheduled one.
on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

# Serialise heartbeat sends so two triggers cannot fire at the same moment.
concurrency:
  group: genesis-heartbeat
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Send heartbeat
        env:
          HF_SPACE_URL: https://genesisno-genesis-automaton.hf.space
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        run: python3 scripts/relay_loop.py heartbeat
