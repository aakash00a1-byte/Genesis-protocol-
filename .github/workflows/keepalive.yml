name: HF Space Keep-Alive

# Pings the Hugging Face Space every 10 minutes to prevent it from sleeping
# (HF free tier sleeps after 48h of inactivity). The Space runs an autonomous
# self-evolving AI (Gluttony/Gluten) that must stay alive 24/7.

on:
  schedule:
    # Every 30 minutes (cron is in UTC). Sleep happens after 48h of inactivity,
    # so 30 min is more than enough while keeping a low, non-abusive footprint.
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allow manual trigger for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping HF Space
        run: |
          URL="https://genesisno-genesis-automaton.hf.space/"
          echo "Pinging $URL at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          # First request wakes the Space if sleeping; retry until it responds
          for attempt in 1 2 3 4 5 6; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 "$URL")
            echo "Attempt $attempt: HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Space is awake and running"
              exit 0
            fi
            echo "Space not ready yet (sleeping/building), retrying in 30s..."
            sleep 30
          done
          echo "⚠️ Space did not return 200 after $attempt attempts"
          exit 1
