name: HF Space Keep-Alive + Telegram Relay

# Keeps the Hugging Face Space awake AND relays queued Telegram replies.
# The Space cannot reach api.telegram.org (HF free tier blocks that egress), so
# it parks replies in /tmp/telegram_reply_queue.json; this job delivers them.
#
# Why a long-running loop instead of a short */10 job: GitHub's scheduled cron
# is heavily delayed on free tier (observed runs ~5 hours apart, not 10 minutes),
# so replies sat in the queue for hours. A single job now runs for ~5h30m and
# pings the Space every 60s, so delivery is near real time and the Space never
# sleeps. A public repo has unlimited Actions minutes, so this costs nothing.

on:
  schedule:
    # Every 4 hours. Each run lasts ~5h30m, so consecutive runs overlap by ~1h30m
    # and cover any scheduler delay. Overlap is harmless for the relay.
    - cron: '0 */4 * * *'
  workflow_dispatch: # Allow manual trigger for testing

# Never cancel a live relay; a queued run starts when the current one ends.
concurrency:
  group: hf-relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    # 5h30m loop + setup, kept under the 6h per-job ceiling.
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Relay + keep-alive loop
        env:
          HF_SPACE_URL: https://genesisno-genesis-automaton.hf.space
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
          RELAY_TICK_SECONDS: "60"
          RELAY_RUN_SECONDS: "19800"
          RELAY_HEARTBEAT_HOURS: "24"
        run: python3 scripts/relay_loop.py

